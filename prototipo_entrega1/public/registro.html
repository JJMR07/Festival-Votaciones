<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Styles.css">
</head>
<body>
    <div class="register-container">
        <form class="register-form" action="registro.php" method="POST">
            <header class="register-header">
                <h1>Registro</h1>
                <p>Ingresa tus datos para crear una cuenta</p>
            </header>
            <div class="register-fields">
                <label for="username">Nombre Completo:</label>
                <input placeholder="Ingresa tu nombre completo" class="form-control" type="text" id="username" name="username" required>
                
                <label for="password">Cedula</label>
                <input placeholder="Ingresa tu cédula" class="form-control" type="text" id="password" name="password" required>

                <label for="email">Correo Electrónico:</label>
                <input placeholder="Ingresa tu correo electrónico" class="form-control" type="email" id="email" name="email" required>

                <label for="password">Contraseña:</label>
                <input placeholder="Ingresa tu contraseña" class="form-control" type="password" id="password" name="password" required>
                
                <input type="submit" value="Registrarse">
            </div>
            <div class="register-footer">
                <p>¿Ya tienes una cuenta? <a href="login.html">Iniciar Sesión</a></p>  
            </div>
        </form>
    </div>
    
</body>
</html>
